name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pooli
          POSTGRES_PASSWORD: pooli
          POSTGRES_DB: pooli
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pooli -d pooli"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://pooli:pooli@localhost:5432/pooli?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: ci-session-secret-change-me-32chars
      RATE_PROVIDER: mock
      MOCK_USDT_TMN_RATE: "126000"
      ENABLE_CHAIN_SIMULATOR: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.6"
      - name: Tidy
        run: go mod tidy
      - name: Vet
        run: go vet $(go list ./... | grep -v /node_modules/)
      - name: Migrate
        run: go run ./cmd/migrate up
      - name: Test
        run: go test $(go list ./... | grep -v /node_modules/)

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --workspace=@pooli/web
      - run: npm run build --workspace=@pooli/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
