# HTTP-only bootstrap for certbot (agent.pooli.shop → pooli-action-gateway :8280).
# After: certbot --nginx -d agent.pooli.shop
# Replace with nginx-agent.pooli.shop.conf.proposed (or let certbot extend this file).

server {
    listen 80;
    listen [::]:80;
    server_name agent.pooli.shop;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8280;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
