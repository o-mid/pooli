services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pooli
      POSTGRES_PASSWORD: pooli
      POSTGRES_DB: pooli
    ports:
      - "5432:5432"
    volumes:
      - pooli_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pooli -d pooli"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pooli_pg:
