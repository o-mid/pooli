<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Pooli payment path">
  <rect width="1600" height="900" fill="#F2F5F3"/>
  <text x="80" y="90" font-family="DM Sans, system-ui, sans-serif" font-size="28" fill="#5A7168">How money moves  not a network diagram</text>
  <text x="80" y="140" font-family="DM Sans, system-ui, sans-serif" font-size="44" font-weight="700" fill="#0B1F1A">Seller ’ link ’ buyer pays the wallet ’ Paid </text>

  <g font-family="DM Sans, system-ui, sans-serif">
    <rect x="80" y="280" width="280" height="160" rx="16" fill="#fff" stroke="rgba(11,31,26,0.1)"/>
    <text x="220" y="350" text-anchor="middle" font-size="22" font-weight="700" fill="#0B1F1A">Seller</text>
    <text x="220" y="385" text-anchor="middle" font-size="16" fill="#5A7168">Amount in toman</text>

    <rect x="440" y="280" width="280" height="160" rx="16" fill="#fff" stroke="rgba(11,31,26,0.1)"/>
    <text x="580" y="350" text-anchor="middle" font-size="22" font-weight="700" fill="#0B1F1A">Link</text>
    <text x="580" y="385" text-anchor="middle" font-size="16" fill="#5A7168">pooli.shop/p/&</text>

    <rect x="800" y="280" width="280" height="160" rx="16" fill="#fff" stroke="rgba(11,31,26,0.1)"/>
    <text x="940" y="350" text-anchor="middle" font-size="22" font-weight="700" fill="#0B1F1A">Buyer pays</text>
    <text x="940" y="385" text-anchor="middle" font-size="16" fill="#5A7168">Exact USDT to seller wallet</text>

    <rect x="1160" y="280" width="360" height="160" rx="16" fill="#0F8F6B"/>
    <text x="1340" y="350" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Paid </text>
    <text x="1340" y="390" text-anchor="middle" font-size="16" fill="#E8EEEB">Server marks it. Not the browser.</text>
  </g>

  <g fill="#5A7168">
    <polygon points="380,360 420,348 420,372"/>
    <polygon points="740,360 780,348 780,372"/>
    <polygon points="1100,360 1140,348 1140,372"/>
  </g>

  <text x="80" y="560" font-family="DM Sans, system-ui, sans-serif" font-size="20" fill="#5A7168">Pooli watches the address. Close enough does not become Paid. We never hold the money.</text>
</svg>
